why_text: >-
  Many spatial analyses repeat the same tasks: define neighborhoods, construct weights,
  fit local models, inspect spatially varying results, and validate numerical behavior.
  SpatialTools provides a small, explicit API for these workflows while keeping distances,
  weights, fitted results, and validation choices visible.
features:
  - name: Spatial weights
    description: Distance, k-nearest-neighbor, and explicit neighborhood structures.
  - name: Local models
    description: Reusable fitted objects with explicit spatial inputs.
  - name: Diagnostics
    description: Residual, influence, and stability summaries.
  - name: Interoperability
    description: NumPy, pandas, GeoPandas, and Shapely-friendly data.
install_note: null
install_command: python -m pip install spatialtools
verify_command: python -c "import spatialtools; print(spatialtools.__version__)"
optional_install_commands: []
quickstart_intro: Fit a local model and inspect the result table.
quickstart_code: |
  import numpy as np
  import pandas as pd
  from spatialtools import LocalRegression

  rng = np.random.default_rng(42)
  coords = rng.uniform(0, 10, size=(100, 2))
  X = pd.DataFrame(rng.normal(size=(100, 2)), columns=["income", "access"])
  y = 2.0 + 1.4 * X["income"] - 0.8 * X["access"]

  model = LocalRegression(bandwidth=20, kernel="bisquare")
  result = model.fit(X, y, coords)
  print(result.to_frame().head())
