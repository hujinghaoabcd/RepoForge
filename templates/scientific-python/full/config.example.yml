navigation: Documentation · Examples · API · Citation
overview_text: >-
  SpatialTools is a reusable scientific Python package for neighborhood-based spatial
  analysis. It provides common numerical foundations for spatial weights, local
  regression, diagnostics, result objects, and geospatial export while keeping
  scientific conventions explicit.
why_text: >-
  Many research workflows repeatedly reimplement neighborhood construction, weighting,
  local fitting, diagnostics, and export. SpatialTools packages these steps into a
  documented and testable interface without hiding distance, bandwidth, weighting, or
  validation choices.
scope_text: >-
  SpatialTools targets local and neighborhood-based exploratory or inferential spatial
  workflows. It is not a general-purpose GIS platform and does not silently choose
  coordinate systems, distance units, neighborhoods, or causal interpretations.
features:
  - name: Spatial weights
    description: Distance, k-nearest-neighbor, and explicit neighborhood structures.
  - name: Local models
    description: Reusable fit and prediction-result objects.
  - name: Diagnostics
    description: Residual, influence, stability, and local-quality summaries.
  - name: Geospatial interoperability
    description: NumPy, pandas, GeoPandas, and Shapely-friendly contracts.
  - name: Reproducibility
    description: Deterministic examples, explicit random seeds, and reference comparisons.
