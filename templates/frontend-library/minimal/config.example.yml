logo_path: null
project_name: MapWidget
tagline: A tiny TypeScript layer-control widget for browser maps.
badges: '[![npm](https://img.shields.io/badge/npm-package-red)](#install) [![TypeScript](https://img.shields.io/badge/TypeScript-ready-blue)](#quick-start) [![License](https://img.shields.io/badge/license-MIT-green)](#license)'
install_command: npm install @geo-ui/map-widget
setup_note: Import the package CSS once in the application entry point with `import "@geo-ui/map-widget/style.css"`.
quickstart_language: ts
quickstart_code: |-
  import { MapWidget } from "@geo-ui/map-widget"
  import "@geo-ui/map-widget/style.css"

  const widget = new MapWidget({
    target: document.querySelector("#layers")!,
    layers: ["roads", "buildings", "water"],
  })

  widget.select("roads")
browser_support: Current evergreen desktop and mobile browsers with ES2020 module support.
license_text: MapWidget is released under the MIT License.
