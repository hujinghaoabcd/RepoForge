logo_path: null
demo_image: null
project_name: MapWidget
display_name: MapWidget
tagline: A modular TypeScript map-control toolkit with a framework-neutral core, official adapters, and explicit runtime contracts.
badges: '[![npm](https://img.shields.io/badge/npm-packages-red)](#packages-and-installation) [![TypeScript](https://img.shields.io/badge/TypeScript-ready-blue)](#typescript-support) [![Tests](https://img.shields.io/badge/tests-passing-brightgreen)](#development-and-testing) [![Bundle](https://img.shields.io/badge/tree--shaking-supported-blue)](#bundle-and-tree-shaking) [![License](https://img.shields.io/badge/license-MIT-green)](#license)'
navigation: Demo · Packages · API · Adapters · Compatibility · Accessibility
why_text: Layer-control UI becomes complex when applications need stable state, keyboard interaction, theming, multiple map engines, framework wrappers, and predictable package boundaries. MapWidget separates a small framework-neutral core from optional integrations.
features:
  - name: Core state and DOM widget
    description: dependency-light package for vanilla browser applications.
  - name: Official map adapters
    description: Leaflet and MapLibre bindings keep engine-specific code out of core.
  - name: Framework adapters
    description: React and Vue packages expose lifecycle-safe wrappers around the same core contract.
  - name: Typed public APIs
    description: declarations and exported event types ship with every maintained package.
  - name: Accessible interaction model
    description: keyboard and focus behavior are tested as part of component behavior.
demo_url: https://example.org/map-widget/playground
packages:
  - name: '@geo-ui/map-widget'
    purpose: framework-neutral core and DOM widget
    install: npm install @geo-ui/map-widget
  - name: '@geo-ui/map-widget-leaflet'
    purpose: Leaflet synchronization adapter
    install: npm install @geo-ui/map-widget @geo-ui/map-widget-leaflet leaflet
  - name: '@geo-ui/map-widget-maplibre'
    purpose: MapLibre GL JS synchronization adapter
    install: npm install @geo-ui/map-widget @geo-ui/map-widget-maplibre maplibre-gl
  - name: '@geo-ui/map-widget-react'
    purpose: React component wrapper
    install: npm install @geo-ui/map-widget-react react
  - name: '@geo-ui/map-widget-vue'
    purpose: Vue component wrapper
    install: npm install @geo-ui/map-widget-vue vue
setup_text: DOM packages require `@geo-ui/map-widget/style.css`. Framework adapters use the same CSS contract, and peer dependencies are not bundled into adapter packages.
quickstart_language: ts
quickstart_code: |-
  import { MapWidget } from "@geo-ui/map-widget"
  import "@geo-ui/map-widget/style.css"

  const widget = new MapWidget({
    target: document.querySelector("#layers")!,
    layers: [
      { id: "roads", label: "Roads", visible: true },
      { id: "water", label: "Water", visible: false },
    ],
  })

  widget.on("visibilitychange", ({ id, visible }) => console.log({ id, visible }))
api_items:
  - name: MapWidget
    purpose: create, update, and destroy the DOM widget.
    stability: public
  - name: LayerItem
    purpose: typed layer identity, label, visibility, and disabled state.
    stability: public
  - name: WidgetEventMap
    purpose: event payload types for selection and visibility changes.
    stability: public
  - name: createStore
    purpose: use state management without rendering the built-in DOM widget.
    stability: public
events:
  - name: visibilitychange
    when: layer visibility changes
    use: synchronize map-engine layer visibility
  - name: select
    when: active layer selection changes
    use: update inspectors or detail panels
  - name: destroy
    when: widget teardown completes
    use: release adapter subscriptions
styling_text: The supported styling surface is a documented set of CSS custom properties and data attributes. Internal class names are not a compatibility contract.
adapters:
  - name: Leaflet
    package: '@geo-ui/map-widget-leaflet'
    notes: official; Leaflet remains a peer dependency
  - name: MapLibre GL JS
    package: '@geo-ui/map-widget-maplibre'
    notes: official; MapLibre remains a peer dependency
  - name: React
    package: '@geo-ui/map-widget-react'
    notes: official lifecycle wrapper
  - name: Vue
    package: '@geo-ui/map-widget-vue'
    notes: official lifecycle wrapper
typescript_text: Packages ship declaration files from the same source as runtime exports. Public option, event, and adapter types follow the package semantic-versioning policy.
bundle_text: ESM builds are side-effect free except for the explicit CSS entry. Named JavaScript exports are designed to tree-shake. Size claims belong in a reproducible size report.
ssr_text: The core state store can be imported without a browser, but DOM widget construction requires `document`. Framework wrappers defer DOM work until client mount.
compatibility:
  - target: Browsers
    range: current and previous evergreen releases
    notes: tested DOM, keyboard, and pointer interactions
  - target: TypeScript
    range: 5.4+
    notes: declaration tests run in CI
  - target: React adapter
    range: React 18+
    notes: optional peer dependency
  - target: Vue adapter
    range: Vue 3.4+
    notes: optional peer dependency
  - target: Leaflet adapter
    range: Leaflet 1.9+
    notes: optional peer dependency
  - target: MapLibre adapter
    range: MapLibre GL JS 5+
    notes: optional peer dependency
accessibility_text: Keyboard navigation, visible focus, accessible names, and disabled-state behavior are tested for the built-in widget. Applications that replace markup or styles must preserve those semantics.
examples:
  - name: Vanilla TypeScript
    link: examples/vanilla/
    description: core widget, CSS, and events
  - name: Leaflet
    link: examples/leaflet/
    description: synchronize visibility with a Leaflet map
  - name: MapLibre
    link: examples/maplibre/
    description: control style-layer visibility
  - name: React
    link: examples/react/
    description: controlled component lifecycle
  - name: Vue
    link: examples/vue/
    description: reactive wrapper and events
development_text: The repository is a pnpm workspace. Core behavior uses unit tests, adapters use integration fixtures, and browser interaction uses Playwright.
development_command: |-
  pnpm install
  pnpm build
  pnpm dev
test_command: |-
  pnpm test
  pnpm test:type
  pnpm test:e2e
versioning_text: Public JavaScript/TypeScript APIs and documented CSS variables follow Semantic Versioning. Peer-dependency support windows and deprecated APIs are announced in release notes.
documentation:
