logo_path: null
screenshot_path: null
project_name: GeoPortal
tagline: A lightweight web application for exploring and sharing geospatial datasets.
badges: '[![Build](https://img.shields.io/badge/build-passing-brightgreen)](#run-locally) [![License](https://img.shields.io/badge/license-MIT-green)](#license)'
intro_text: >-
  GeoPortal provides a focused browser interface for browsing map layers,
  inspecting feature properties, and sharing a small public catalogue.
features:
  - Interactive map and layer switcher
  - Feature inspection and simple attribute search
  - Shareable map views with URL state
run_intro: Install dependencies and start the development server.
run_command: |-
  npm install
  npm run dev
local_url: http://localhost:5173
configuration:
  - name: VITE_API_URL
    description: base URL used by the browser client for data requests
    example: http://localhost:8000
deploy_text: >-
  Build the static frontend and publish the generated `dist/` directory behind
  a normal static web server.
deploy_command: npm run build
license_text: GeoPortal is released under the MIT License.
