logo_path: null
project_name: ForecastBench
tagline: Reproducible benchmark code for short-horizon traffic forecasting across standard sensor datasets.
badges: '[![Python](https://img.shields.io/badge/Python-3.11%2B-blue)](#environment) [![Paper](https://img.shields.io/badge/paper-study-blue)](#citation) [![Tests](https://img.shields.io/badge/tests-passing-brightgreen)](#environment) [![License](https://img.shields.io/badge/license-MIT-green)](#license)'
navigation: Paper · Data · Reproduction · Results · Citation
paper_link: docs/paper.md
overview_text: ForecastBench is a paper-oriented repository for reproducing the main training and evaluation path of a traffic forecasting study. The README documents the experiment contract; detailed model theory remains in the paper and method documentation.
model_text: The study predicts the next 12 traffic-flow steps from the previous 12 observations using a graph-based spatiotemporal forecasting model and a fixed benchmark protocol.
datasets:
  - name: PeMSD8
    role: main benchmark
    path: data/PeMSD8/data.npz
    notes: 5-minute flow observations with the documented train/validation/test split
  - name: PeMSD4
    role: secondary benchmark
    path: data/PeMSD4/data.npz
    notes: same preprocessing contract as the main benchmark
environment_text: Install the reference Python environment before running training or evaluation.
environment_command: python -m pip install -r requirements.txt
hardware_note: The canonical configuration is designed for one CUDA-capable GPU; CPU execution is supported for smoke tests but not representative training time.
commands:
  - name: Train the main configuration
    description: Train the proposed model on the main benchmark using the reference configuration.
    command: python scripts/train.py --config configs/main/pemsd8.yml --seed 42
  - name: Evaluate a checkpoint
    description: Evaluate the selected checkpoint without retraining.
    command: python scripts/evaluate.py --config configs/main/pemsd8.yml --checkpoint results/pemsd8/best.pt
protocol:
  split: 60% train / 20% validation / 20% test in chronological order
  preprocessing: Z-score normalization fitted on the training split only; flow is the prediction target
  seeds: one documented reference seed for the Standard profile; use Full when multi-seed inference is part of the claim
  metrics: MAE, RMSE, and MAPE over the 12-step prediction horizon
  model_selection: select the checkpoint with the best validation MAE and evaluate the test split once
results_intro: The table is a compact sanity target for the example repository. Published projects should replace these placeholders with verified values and preserve the underlying result files.
results:
  - setting: PeMSD8 / proposed
    metric: MAE
    value: '15.20'
  - setting: PeMSD8 / proposed
    metric: RMSE
    value: '24.60'
  - setting: PeMSD4 / proposed
    metric: MAE
    value: '19.10'
output_text: Training writes checkpoints, resolved configuration, logs, and metric JSON files under `results/<dataset>/`. Evaluation writes test metrics next to the selected checkpoint.
structure_text: |-
  configs/       experiment configurations
  data/          benchmark inputs
  models/        model definitions
  scripts/       train and evaluate entry points
  results/       checkpoints, logs, and metrics
  docs/          protocol and reproducibility notes
citation:
  intro: Cite the study paper for the experimental results and the software release when this implementation is used directly.
  paper: docs/paper.md
  cff: CITATION.cff
license_text: ForecastBench is released under the MIT License.
