logo_path: null
project_name: LatentMap
tagline: A compact research method for learning task-aware latent distances.
badges: '[![Python](https://img.shields.io/badge/Python-3.11%2B-blue)](#installation) [![Paper](https://img.shields.io/badge/paper-method-blue)](#citation) [![License](https://img.shields.io/badge/license-MIT-green)](#license)'
paper_link: docs/paper.md
method_statement: LatentMap learns a low-dimensional representation in which pairwise distances are optimized for a documented prediction or similarity objective.
install_command: python -m pip install latentmap
quickstart_intro: Learn a two-dimensional latent representation from a tiny feature matrix.
quickstart_code: |
  import numpy as np
  from latentmap import LatentMap

  X = np.array([[0.0, 1.0], [1.0, 1.2], [2.0, 2.1], [3.0, 2.8]])
  y = np.array([0.0, 0.2, 0.9, 1.1])
  result = LatentMap(n_components=2, random_state=42).fit(X, y)
  print(result.embedding_)
validation:
  summary: The implementation is checked on deterministic synthetic recovery cases and fixed numerical fixtures.
  checks:
    - documented seeds reproduce the reference embedding within tolerance
    - degenerate inputs fail explicitly instead of producing silent coordinates
citation:
  intro: Cite the method paper when using LatentMap in research and cite the software release when the implementation matters.
  paper: docs/paper.md
  cff: CITATION.cff
license_text: LatentMap is released under the MIT License.
