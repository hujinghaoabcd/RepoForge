[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoforge-standards"
dynamic = ["version"]
description = "Reusable README templates and repository documentation standards."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Jinghao Hu" }
]
keywords = [
  "readme",
  "repository",
  "documentation",
  "github",
  "project-standards",
  "templates",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/hujinghaoabcd/RepoForge"
Repository = "https://github.com/hujinghaoabcd/RepoForge"
Issues = "https://github.com/hujinghaoabcd/RepoForge/issues"
Changelog = "https://github.com/hujinghaoabcd/RepoForge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
release = [
  "build>=1.2",
  "twine>=6.0",
]

[project.scripts]
repoforge = "repoforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "repoforge.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
