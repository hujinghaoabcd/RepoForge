cases:
- name: tiny-internal-dashboard
  profile: minimal
  overrides: cases/tiny-internal-dashboard.yml
  min_lines: 45
  max_lines: 90
  required_sections:
  - '## Features'
  - '## Run Locally'
  - '## Configuration'
  - '## Deploy'
  forbidden_sections:
  - '## Architecture'
  - '## CI/CD'
  - '## Observability and Operations'
- name: server-rendered-monolith
  profile: standard
  overrides: cases/server-rendered-monolith.yml
  min_lines: 90
  max_lines: 180
  required_sections:
  - '## Tech Stack'
  - '## Local Development'
  - '## Database'
  - '## Deployment'
  - '## Testing'
  forbidden_sections:
  - '## CI/CD'
  - '## Observability and Operations'
- name: split-frontend-api
  profile: standard
  overrides: cases/split-frontend-api.yml
  min_lines: 100
  max_lines: 190
  required_sections:
  - '## Tech Stack'
  - '## Environment Variables'
  - '## Database'
  - '## Deployment'
  forbidden_sections:
  - '## Background Jobs and Queues'
  - '## Object Storage / Media'
- name: self-hosted-multiservice
  profile: full
  overrides: cases/self-hosted-multiservice.yml
