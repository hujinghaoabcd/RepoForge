project_status: ModelAtlas is pre-1.0 but maintains documented deprecation notes for public APIs. Experimental submodules are explicitly marked and excluded from stability guarantees.
limitations:
  - a common API does not make all model families scientifically interchangeable
  - automatic method selection is intentionally out of scope
  - local-model outputs must not be interpreted causally without an appropriate design
