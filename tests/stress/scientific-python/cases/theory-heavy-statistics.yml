project_status: BayesField is research software with a documented public API; new model families may remain experimental until their validation scope is complete.
limitations:
  - posterior concentration does not imply causal identification
  - convergence diagnostics do not establish that the scientific model is appropriate
  - prior sensitivity should be assessed for conclusions that materially depend on prior structure
