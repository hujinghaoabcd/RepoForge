project_name: DeskHash
tagline: A small Windows desktop utility for hashing files by drag and drop.
screenshot_path: null
badges:
  - alt: Release
    image: https://img.shields.io/badge/release-v1.0-blue
    link: '#download-and-install'
  - alt: Platform
    image: https://img.shields.io/badge/platform-Windows-lightgrey
    link: '#supported-platforms'
  - alt: Build
    image: https://img.shields.io/badge/build-passing-brightgreen
    link: '#run-from-source'
  - alt: License
    image: https://img.shields.io/badge/license-MIT-green
    link: '#license'
navigation:
  - label: Download
    link: '#download-and-install'
  - label: Issues
    link: https://github.com/example/deshhash/issues
features:
  - name: Drag and drop
    description: compute SHA-256 hashes for local files.
  - name: Copy results
    description: copy the digest without writing sidecar files.
download_text: Download the signed Windows executable from Releases.
download_options:
  - platform: Windows
    package: x64 `.exe`
    link: Releases / `DeskHash.exe`
platforms:
  - name: Windows
    support: Windows 11 x64
run_from_source: |-
  python -m pip install -e .
  python -m deskhash
license_text: DeskHash is released under the MIT License.
