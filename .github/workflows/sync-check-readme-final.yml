name: sync-check-readme-final

on:
  push:
    branches: [feature/check-v1]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/check-v1

      - name: Update remaining README status lines
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": (
                  "The current CLI implements `repoforge render`, explicit `repoforge init`, review-first `repoforge diff`, and the safety-first `repoforge apply` workflow.",
                  "The current CLI implements `repoforge render`, explicit `repoforge init`, review-first `repoforge diff`, safety-first `repoforge apply`, and CI-facing `repoforge check`.",
              ),
              "README.zh-CN.md": (
                  "当前 CLI 已经实现 `repoforge render`、显式配置的 `repoforge init`、用于精确审查的 `repoforge diff` 和安全优先的 `repoforge apply`。",
                  "当前 CLI 已经实现 `repoforge render`、显式配置的 `repoforge init`、用于精确审查的 `repoforge diff`、安全优先的 `repoforge apply`，以及面向 CI 的 `repoforge check`。",
              ),
          }

          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit synchronized README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-check-readme-final.yml
          git add README.md README.zh-CN.md
          git commit -m "docs: include check in CLI overview"
          git push
