name: sync-apply-readme

on:
  push:
    branches:
      - feature/apply-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/apply-v1
          fetch-depth: 0

      - name: Update README apply status
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": [
                  (
                      "The output is ordinary Markdown. You can review it with Git, edit project-specific prose, and move deeper material into `docs/`.",
                      """The output is ordinary Markdown. You can review it with Git, edit project-specific prose, and move deeper material into `docs/`.\n\nApply a README and the repository standards selected by the matrices to an existing repository:\n\n```bash\nrepoforge apply /path/to/project \\\n  --type scientific-python \\\n  --profile standard \\\n  --config examples/apply/scientific-python-standard.yml \\\n  --dry-run\n```\n\nReview the plan, then run the same command without `--dry-run`. RepoForge refuses to overwrite differing selected files unless `--force` is supplied. See [`docs/APPLY.md`](docs/APPLY.md).""",
                  ),
                  (
                      "Current CLI scope is intentionally narrow: `repoforge render` is implemented. Repository-level standards are now modeled under `standards/`, while apply/update workflows remain roadmap work rather than finished commands.",
                      "The current CLI implements both `repoforge render` and the safety-first `repoforge apply` workflow. Repository standards are selected from explicit project type/profile matrices; automatic project detection is intentionally not part of the design.",
                  ),
                  (
                      "GitHub Actions runs the tests on Python **3.11, 3.12, and 3.13** and performs CLI render smoke tests for all seven template families.",
                      "GitHub Actions runs the tests on Python **3.11, 3.12, and 3.13**, performs CLI render smoke tests for all seven template families, and exercises `repoforge apply` against a temporary repository.",
                  ),
                  (
                      "Reusable Jinja templates live under [`standards/community/`](standards/community/), and [`standards/matrix.yml`](standards/matrix.yml) records whether each file is `default`, `recommended`, or `optional` for every explicit project type/profile pair. The standards layer intentionally does **not** infer project type.",
                      """Reusable repository standards now live in three packs:\n\n- [`standards/community/`](standards/community/) — Code of Conduct, contributing, security, and support;\n- [`standards/github/`](standards/github/) — Issue Forms and pull-request templates;\n- [`standards/metadata/`](standards/metadata/) — `CITATION.cff` and `CHANGELOG.md`.\n\nEach pack has explicit policy rules for project type/profile combinations. The standards layer intentionally does **not** infer project type.""",
                  ),
                  (
                      "RepoForge is **usable now for explicit, configuration-driven README rendering**. From a source checkout you can select any of the seven project types, choose `minimal`, `standard`, or `full`, provide YAML configuration, and render a Markdown README with the strict CLI.",
                      "RepoForge is **usable now for explicit, configuration-driven README rendering and repository-standard application**. From a source checkout you select one of the seven project types and a profile, provide one combined YAML configuration, and either render a README alone or apply the selected repository pack to an existing repository.",
                  ),
                  (
                      "- `repoforge render`;\n- 7 project types × 3 independent profiles;\n- strict Jinja/YAML validation;\n- committed examples and golden previews;\n- renderer-backed stress tests and Python 3.11–3.13 CI.",
                      "- `repoforge render`;\n- `repoforge apply` with `--dry-run`, safe conflict preflight, `--force`, and standards policy overrides;\n- 7 project types × 3 independent profiles;\n- community, GitHub collaboration, citation, and changelog standards;\n- strict Jinja/YAML validation;\n- committed examples and golden previews;\n- renderer-backed stress tests and Python 3.11–3.13 CI.",
                  ),
                  (
                      "- `init`, `apply`, `diff`, and `check` repository workflows;\n- managed partial updates to an existing hand-edited README;",
                      "- `init`, `diff`, and `check` repository workflows;\n- managed partial updates or semantic merges inside an existing hand-edited README;",
                  ),
                  (
                      "So the current release is already useful as a **template renderer and standards reference**, but it is not yet the final zero-configuration repository automation tool.",
                      "So the current release is already useful as a **README and repository-standards application tool**, but it intentionally remains explicit rather than becoming a zero-configuration project detector.",
                  ),
                  (
                      "The next implementation stage is to finish repository-level standards and then apply them with an explicit type/profile selection:\n\n```text\nrepoforge init .       # planned: create a RepoForge config\nrepoforge apply .      # planned: apply README + selected repository standards\nrepoforge diff .       # planned: preview managed changes\nrepoforge check .      # planned: validate repository documentation contracts\n```\n\nThese commands are roadmap targets, **not current CLI promises**. The current supported command is `repoforge render`.",
                      """The repository standards packs and first apply workflow are now implemented. The next workflow layer is:\n\n```text\nrepoforge init .       # planned: create a combined RepoForge config\nrepoforge diff .       # planned: show textual diffs for the apply plan\nrepoforge check .      # planned: validate repository documentation contracts\n```\n\nThe currently supported CLI commands are `repoforge render` and `repoforge apply`.""",
                  ),
              ],
              "README.zh-CN.md": [
                  (
                      "输出结果就是普通 Markdown，可以用 Git 审查、继续人工修改，并把过深内容下沉到 `docs/`。",
                      """输出结果就是普通 Markdown，可以用 Git 审查、继续人工修改，并把过深内容下沉到 `docs/`。\n\n把 README 和矩阵选中的仓库标准应用到已有项目时，可以先 Dry Run：\n\n```bash\nrepoforge apply /path/to/project \\\n  --type scientific-python \\\n  --profile standard \\\n  --config examples/apply/scientific-python-standard.yml \\\n  --dry-run\n```\n\n确认计划后去掉 `--dry-run` 再执行。RepoForge 默认拒绝覆盖内容不同的已有文件，只有显式使用 `--force` 才会覆盖。完整说明见 [`docs/APPLY.md`](docs/APPLY.md)。""",
                  ),
                  (
                      "当前 CLI 范围有意保持明确：已经实现的是 `repoforge render`。仓库级标准现在已经在 `standards/` 中建模，而 apply/update 工作流仍属于后续 Roadmap，不会提前当成已经可用的命令宣传。",
                      "当前 CLI 已经实现 `repoforge render` 和安全优先的 `repoforge apply`。仓库标准根据显式选择的项目类型/Profile 矩阵决定；RepoForge 明确不做项目类型自动判断。",
                  ),
                  (
                      "GitHub Actions 会在 Python **3.11、3.12、3.13** 上运行测试，并对全部七类模板执行 CLI Render Smoke Test。",
                      "GitHub Actions 会在 Python **3.11、3.12、3.13** 上运行测试，对全部七类模板执行 CLI Render Smoke Test，并在临时仓库上真实执行 `repoforge apply`。",
                  ),
                  (
                      "可复用 Jinja 模板位于 [`standards/community/`](standards/community/)，[`standards/matrix.yml`](standards/matrix.yml) 则为每个显式项目类型/Profile 组合标记这些文件是 `default`、`recommended` 还是 `optional`。这一层明确**不做项目类型自动判断**。",
                      """可复用仓库标准现在分成三组：\n\n- [`standards/community/`](standards/community/) —— Code of Conduct、贡献、安全与支持；\n- [`standards/github/`](standards/github/) —— Issue Forms 与 Pull Request Template；\n- [`standards/metadata/`](standards/metadata/) —— `CITATION.cff` 与 `CHANGELOG.md`。\n\n每组都根据显式项目类型/Profile 提供策略规则。这一层明确**不做项目类型自动判断**。""",
                  ),
                  (
                      "RepoForge **现在已经可以用于“显式配置驱动的 README 生成”**。从源码安装后，可以选择七种项目类型中的任意一种，再选择 `minimal`、`standard` 或 `full`，提供 YAML 配置，通过严格 CLI 生成普通 Markdown README。",
                      "RepoForge **现在已经可以用于“显式配置驱动的 README 生成 + 仓库标准应用”**。从源码安装后，显式选择七种项目类型之一和对应 Profile，提供一份合并 YAML 配置，就可以只渲染 README，也可以把选中的仓库标准安全应用到已有项目。",
                  ),
                  (
                      "- `repoforge render`；\n- 7 类项目 × 3 套独立 Profile；\n- 严格 Jinja/YAML 配置校验；\n- 完整 Example 与 Golden Preview；\n- Renderer 压力测试以及 Python 3.11–3.13 CI。",
                      "- `repoforge render`；\n- `repoforge apply`，包含 `--dry-run`、冲突预检查、`--force` 和标准选择覆盖；\n- 7 类项目 × 3 套独立 Profile；\n- 社区、GitHub 协作、Citation 与 Changelog 标准；\n- 严格 Jinja/YAML 配置校验；\n- 完整 Example 与 Golden Preview；\n- Renderer 压力测试以及 Python 3.11–3.13 CI。",
                  ),
                  (
                      "- `init`、`apply`、`diff`、`check` 等仓库工作流；\n- 对已经人工修改过的 README 做受控局部更新；",
                      "- `init`、`diff`、`check` 等仓库工作流；\n- 对已经人工修改过的 README 做受控局部更新或语义合并；",
                  ),
                  (
                      "因此当前版本已经可以作为**模板生成器与仓库文档规范参考**实际使用，但还不是最终的“零配置自动整理整个仓库”工具。",
                      "因此当前版本已经可以作为**README 与仓库标准应用工具**实际使用，而且会保持显式配置，而不是发展成零配置的项目类型猜测器。",
                  ),
                  (
                      "下一阶段先补齐仓库级标准，再通过显式的项目类型/Profile 选择把它们应用到仓库：\n\n```text\nrepoforge init .       # 计划：创建 RepoForge 配置\nrepoforge apply .      # 计划：应用 README + 选定仓库标准\nrepoforge diff .       # 计划：预览受管理的变化\nrepoforge check .      # 计划：检查仓库文档合同\n```\n\n这些命令属于 Roadmap，**目前不是已经实现的 CLI 承诺**。当前支持的命令仍然是 `repoforge render`。",
                      """仓库标准层和第一版 Apply 工作流已经实现。下一阶段是：\n\n```text\nrepoforge init .       # 计划：创建合并的 RepoForge 配置\nrepoforge diff .       # 计划：展示 Apply 计划的文本 Diff\nrepoforge check .      # 计划：检查仓库文档合同\n```\n\n当前正式支持的 CLI 命令是 `repoforge render` 和 `repoforge apply`。""",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected block not found in {filename}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm -f .github/workflows/sync-apply-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "docs: document repository apply workflow"
          git push origin HEAD:feature/apply-v1
