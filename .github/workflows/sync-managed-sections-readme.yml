name: sync-managed-sections-readme

on:
  push:
    branches: [feature/managed-sections-v1]
    paths:
      - .github/workflows/sync-managed-sections-readme.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/managed-sections-v1
      - name: Update README status
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": [
                  (
                      "- `repoforge check` for CI-facing config, drift, CFF/Issue Form, and placeholder validation;\n- 7 project types × 3 independent profiles;",
                      "- `repoforge check` for CI-facing config, drift, CFF/Issue Form, and placeholder validation;\n- Managed Sections v1 for README `identity`, `badges`, and `navigation`, while body prose remains user-owned;\n- 7 project types × 3 independent profiles;",
                  ),
                  (
                      "Not implemented yet:\n\n- managed partial updates or semantic merges inside an existing hand-edited README;\n- a published PyPI release.",
                      "Not implemented yet:\n\n- semantic management/merging of README body sections beyond the v1 header regions;\n- a published PyPI release.",
                  ),
                  (
                      "The repository standards packs plus `init`, `diff`, `apply`, and `check` are now implemented. The next productization layer is managed partial/semantic updates for hand-edited files and a published package.",
                      "The repository standards packs plus `init`, `diff`, `apply`, and `check` are implemented. Managed Sections v1 now preserves hand-edited README body prose while maintaining the stable header regions. The next productization layer is broader semantic body management and a published package.",
                  ),
                  (
                      "The currently supported CLI commands are `repoforge render`, `repoforge init`, `repoforge diff`, `repoforge apply`, and `repoforge check`.",
                      "The currently supported CLI commands are `repoforge render`, `repoforge init`, `repoforge diff`, `repoforge apply`, and `repoforge check`. New `init` configs use `readme_management: managed-sections`; see [`docs/MANAGED_SECTIONS.md`](docs/MANAGED_SECTIONS.md).",
                  ),
              ],
              "README.zh-CN.md": [
                  (
                      "- `repoforge check`，用于 CI 中检查配置、漂移、CFF/Issue Form 结构以及关键占位符；\n- 7 类项目 × 3 套独立 Profile；",
                      "- `repoforge check`，用于 CI 中检查配置、漂移、CFF/Issue Form 结构以及关键占位符；\n- Managed Sections v1，仅托管 README 的 `identity`、`badges`、`navigation`，正文继续由用户维护；\n- 7 类项目 × 3 套独立 Profile；",
                  ),
                  (
                      "还没有实现：\n\n- 对已经人工修改过的 README 做受控局部更新或语义合并；\n- 正式发布到 PyPI。",
                      "还没有实现：\n\n- 对 v1 头部区域之外的 README 正文做语义级托管/合并；\n- 正式发布到 PyPI。",
                  ),
                  (
                      "仓库标准层以及 `init`、`diff`、`apply`、`check` 工作流已经实现。下一阶段重点转向对人工维护文件的受控局部/语义更新，以及正式包发布。",
                      "仓库标准层以及 `init`、`diff`、`apply`、`check` 工作流已经实现。Managed Sections v1 现在可以保留人工维护的 README 正文，只更新稳定头部区域。下一阶段重点转向更广泛的正文语义托管，以及正式包发布。",
                  ),
                  (
                      "当前正式支持的 CLI 命令是 `repoforge render`、`repoforge init`、`repoforge diff`、`repoforge apply` 和 `repoforge check`。",
                      "当前正式支持的 CLI 命令是 `repoforge render`、`repoforge init`、`repoforge diff`、`repoforge apply` 和 `repoforge check`。新的 `init` 配置默认使用 `readme_management: managed-sections`，详见 [`docs/MANAGED_SECTIONS.md`](docs/MANAGED_SECTIONS.md)。",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected README text not found in {filename}: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/sync-managed-sections-readme.yml
          git config user.name "Jinghao Hu"
          git config user.email "731409213@qq.com"
          git add README.md README.zh-CN.md .github/workflows/sync-managed-sections-readme.yml
          git commit -m "docs: describe managed README sections"
          git push origin HEAD:feature/managed-sections-v1
