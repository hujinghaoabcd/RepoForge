name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: python -m pip install -e ".[release]"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python -c 'from repoforge import __version__; print(__version__)')"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}; expected ${expected}."
            exit 1
          fi

      - name: Build and verify distributions
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          version="$(python -c 'from repoforge import __version__; print(__version__)')"
          python scripts/verify_distribution.py dist --version "${version}"

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/repoforge-standards
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repoforge-standards
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Create GitHub release from the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" =~ [A-Za-z] ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "RepoForge ${GITHUB_REF_NAME}" \
            "${flags[@]}"
