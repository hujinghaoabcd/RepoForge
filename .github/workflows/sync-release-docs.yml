name: sync release docs

on:
  push:
    branches:
      - feature/release-0.1.0a1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/release-0.1.0a1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update release-facing documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "README.md",
              "https://img.shields.io/badge/version-0.1.0.dev0-174D5B.svg",
              "https://img.shields.io/badge/version-0.1.0a1-174D5B.svg",
          )
          replace(
              "README.md",
              '  <a href="docs/ARCHITECTURE.md">Architecture</a> ·\n  <a href="#tests-and-stress-suites">Tests</a>',
              '  <a href="docs/ARCHITECTURE.md">Architecture</a> ·\n  <a href="docs/RELEASE.md">Release</a> ·\n  <a href="#tests-and-stress-suites">Tests</a>',
          )
          replace(
              "README.md",
              "Clone and install RepoForge from source:\n\n```bash\ngit clone https://github.com/hujinghaoabcd/RepoForge.git\ncd RepoForge\npython -m pip install -e \".[test]\"\n```",
              "The Python distribution is named `repoforge-standards`; the import package and CLI remain `repoforge`. For a published release:\n\n```bash\npython -m pip install repoforge-standards\nrepoforge --version\n```\n\nFor unreleased development or contributing, install from source:\n\n```bash\ngit clone https://github.com/hujinghaoabcd/RepoForge.git\ncd RepoForge\npython -m pip install -e \".[test]\"\n```",
          )
          replace(
              "README.md",
              "See [`docs/INIT.md`](docs/INIT.md), [`docs/DIFF.md`](docs/DIFF.md), [`docs/APPLY.md`](docs/APPLY.md), and [`docs/CHECK.md`](docs/CHECK.md).",
              "See [`docs/INIT.md`](docs/INIT.md), [`docs/DIFF.md`](docs/DIFF.md), [`docs/APPLY.md`](docs/APPLY.md), [`docs/CHECK.md`](docs/CHECK.md), and [`docs/RELEASE.md`](docs/RELEASE.md).",
          )
          replace(
              "README.md",
              "- a published PyPI release.",
              "- production PyPI publication; `0.1.0a1` packaging and Trusted Publishing automation are prepared under the `repoforge-standards` distribution name, but the index release has not been executed yet.",
          )
          replace(
              "README.md",
              "The repository standards packs plus `init`, `diff`, `apply`, and `check` are implemented. Managed Sections v1 now preserves hand-edited README body prose while maintaining the stable header regions. The next productization layer is broader semantic body management and a published package.",
              "The repository standards packs plus `init`, `diff`, `apply`, and `check` are implemented. Managed Sections v1 preserves hand-edited README body prose while maintaining the stable header regions. Version `0.1.0a1` is package-ready with verified wheel/sdist builds and Trusted Publishing automation; the remaining release step is the first TestPyPI/PyPI publication after publisher setup.",
          )

          replace(
              "README.zh-CN.md",
              "https://img.shields.io/badge/version-0.1.0.dev0-174D5B.svg",
              "https://img.shields.io/badge/version-0.1.0a1-174D5B.svg",
          )
          replace(
              "README.zh-CN.md",
              '  <a href="docs/ARCHITECTURE.md">架构</a> ·\n  <a href="#测试与压力测试">测试</a>',
              '  <a href="docs/ARCHITECTURE.md">架构</a> ·\n  <a href="docs/RELEASE.md">发布</a> ·\n  <a href="#测试与压力测试">测试</a>',
          )
          replace(
              "README.zh-CN.md",
              "从源码安装 RepoForge：\n\n```bash\ngit clone https://github.com/hujinghaoabcd/RepoForge.git\ncd RepoForge\npython -m pip install -e \".[test]\"\n```",
              "PyPI Distribution 名称为 `repoforge-standards`，Python Import 与 CLI 仍保持 `repoforge`。对于已经正式发布的版本：\n\n```bash\npython -m pip install repoforge-standards\nrepoforge --version\n```\n\n开发未发布版本或参与贡献时，从源码安装：\n\n```bash\ngit clone https://github.com/hujinghaoabcd/RepoForge.git\ncd RepoForge\npython -m pip install -e \".[test]\"\n```",
          )
          replace(
              "README.zh-CN.md",
              "详细说明见 [`docs/INIT.md`](docs/INIT.md)、[`docs/DIFF.md`](docs/DIFF.md) 和 [`docs/APPLY.md`](docs/APPLY.md)。",
              "详细说明见 [`docs/INIT.md`](docs/INIT.md)、[`docs/DIFF.md`](docs/DIFF.md)、[`docs/APPLY.md`](docs/APPLY.md)、[`docs/CHECK.md`](docs/CHECK.md) 和 [`docs/RELEASE.md`](docs/RELEASE.md)。",
          )
          replace(
              "README.zh-CN.md",
              "- 正式发布到 PyPI。",
              "- 正式发布到 PyPI；`0.1.0a1` 已按 `repoforge-standards` Distribution 名完成打包与 Trusted Publishing 自动化准备，但尚未执行首次索引发布。",
          )
          replace(
              "README.zh-CN.md",
              "仓库标准层以及 `init`、`diff`、`apply`、`check` 工作流已经实现。Managed Sections v1 现在可以保留人工维护的 README 正文，只更新稳定头部区域。下一阶段重点转向更广泛的正文语义托管，以及正式包发布。",
              "仓库标准层以及 `init`、`diff`、`apply`、`check` 工作流已经实现。Managed Sections v1 可以保留人工维护的 README 正文，只更新稳定头部区域。`0.1.0a1` 已通过 wheel/sdist 构建与脱离源码安装验证，并准备好 Trusted Publishing；剩余发布步骤是在 Publisher 配置完成后执行首次 TestPyPI/PyPI 发布。",
          )

          replace(
              "CHANGELOG.md",
              "RepoForge is currently in `0.1.0.dev0` Alpha development; no stable release has been published yet.",
              "RepoForge is currently preparing the `0.1.0a1` Alpha package release; no stable release has been published yet.",
          )
          replace(
              "CHANGELOG.md",
              "- Managed Sections v1 for README `identity`, `badges`, and `navigation`, preserving user-owned body prose across `diff`, `apply`, and `check`.",
              "- Managed Sections v1 for README `identity`, `badges`, and `navigation`, preserving user-owned body prose across `diff`, `apply`, and `check`.\n- PyPI distribution metadata under the `repoforge-standards` name while preserving the `repoforge` import package and CLI.\n- `repoforge --version` backed by one canonical package version source.\n- Self-contained wheel runtime data for all README templates and repository standards, plus rebuildable sdist packaging.\n- Distribution integrity checks and fresh wheel/sdist installation smoke tests outside the source checkout.\n- TestPyPI/PyPI Trusted Publishing workflow with isolated OIDC publish jobs and tag/version verification.\n- GitHub Release creation for verified tag releases.",
          )
          replace(
              "CHANGELOG.md",
              "- New `repoforge init` configs default to `readme_management: managed-sections`; legacy configs without the field retain whole-file README ownership.",
              "- New `repoforge init` configs default to `readme_management: managed-sections`; legacy configs without the field retain whole-file README ownership.\n- GitHub Actions checkout/setup-python workflows use the Node 24 based v6 actions for the `0.1.0a1` release line.",
          )
          PY

          rm .github/workflows/sync-release-docs.yml

      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md CHANGELOG.md .github/workflows/sync-release-docs.yml
          git commit -m "docs: prepare 0.1.0a1 release guidance"
          git push origin HEAD:feature/release-0.1.0a1
