name: branding-sync

on:
  push:
    branches: [refine/readme-branding-v1]
    paths:
      - "tests/branding.yml"
      - "scripts/normalize_branding.py"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/readme-branding-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RepoForge
        run: python -m pip install -e ".[test]"

      - name: Normalize README branding and regenerate previews
        run: python scripts/normalize_branding.py

      - name: Commit generated branding updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates tests/previews
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "style: normalize README branding across template matrix"
          git push origin HEAD:refine/readme-branding-v1
