name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest

      - name: CLI smoke
        run: |
          repoforge render scientific-python minimal \
            --config templates/scientific-python/minimal/config.example.yml \
            --output /tmp/README.scientific-python.md
          repoforge render research-algorithm minimal \
            --config templates/research-algorithm/minimal/config.example.yml \
            --output /tmp/README.research-algorithm.md
          repoforge render research-experiment minimal \
            --config templates/research-experiment/minimal/config.example.yml \
            --output /tmp/README.research-experiment.md
          repoforge render django-package minimal \
            --config templates/django-package/minimal/config.example.yml \
            --output /tmp/README.django-package.md
          repoforge render web-application minimal \
            --config templates/web-application/minimal/config.example.yml \
            --output /tmp/README.web-application.md
          repoforge render frontend-library minimal \
            --config templates/frontend-library/minimal/config.example.yml \
            --output /tmp/README.frontend-library.md
          repoforge render desktop-application minimal \
            --config templates/desktop-application/minimal/config.example.yml \
            --output /tmp/README.desktop-application.md

          test -s /tmp/README.scientific-python.md
          test -s /tmp/README.research-algorithm.md
          test -s /tmp/README.research-experiment.md
          test -s /tmp/README.django-package.md
          test -s /tmp/README.web-application.md
          test -s /tmp/README.frontend-library.md
          test -s /tmp/README.desktop-application.md

      - name: Init, diff, apply, and check smoke
        run: |
          rm -rf /tmp/repoforge-init
          mkdir -p /tmp/repoforge-init

          repoforge init /tmp/repoforge-init \
            --type scientific-python \
            --profile standard \
            --name SmokeProject \
            --repository-url https://github.com/example/smoke-project

          test -s /tmp/repoforge-init/repoforge.yml

          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("/tmp/repoforge-init/repoforge.yml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          config["code_of_conduct"]["reporting_contact"] = "conduct@example.org"
          config["security"]["reporting_contact"] = "security@example.org"
          config["citation"]["authors"] = [
              {
                  "family_names": "Smith",
                  "given_names": "Alex",
                  "orcid": None,
                  "affiliation": "Example Lab",
              }
          ]
          setup = config["contributing"]["setup_command"]
          config["contributing"]["setup_command"] = setup.replace(
              "https://github.com/example/example-project.git",
              "https://github.com/example/smoke-project.git",
          )
          path.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY

          repoforge diff /tmp/repoforge-init \
            --config /tmp/repoforge-init/repoforge.yml \
            > /tmp/repoforge-before.diff

          grep -q "\[create\] README.md" /tmp/repoforge-before.diff
          grep -q "+++ b/README.md" /tmp/repoforge-before.diff
          test ! -e /tmp/repoforge-init/README.md

          repoforge apply /tmp/repoforge-init \
            --config /tmp/repoforge-init/repoforge.yml \
            --dry-run

          test ! -e /tmp/repoforge-init/README.md

          repoforge apply /tmp/repoforge-init \
            --config /tmp/repoforge-init/repoforge.yml

          test -s /tmp/repoforge-init/README.md
          grep -q "repoforge:start identity" /tmp/repoforge-init/README.md
          grep -q "repoforge:start badges" /tmp/repoforge-init/README.md
          grep -q "repoforge:start navigation" /tmp/repoforge-init/README.md
          test -s /tmp/repoforge-init/CODE_OF_CONDUCT.md
          test -s /tmp/repoforge-init/CONTRIBUTING.md
          test -s /tmp/repoforge-init/SECURITY.md
          test -s /tmp/repoforge-init/CITATION.cff
          test -s /tmp/repoforge-init/CHANGELOG.md
          test -s /tmp/repoforge-init/.github/ISSUE_TEMPLATE/01-bug-report.yml
          test -s /tmp/repoforge-init/.github/pull_request_template.md

          repoforge diff /tmp/repoforge-init \
            --config /tmp/repoforge-init/repoforge.yml \
            > /tmp/repoforge-after.diff

          grep -qx "No changes." /tmp/repoforge-after.diff

          repoforge check /tmp/repoforge-init > /tmp/repoforge-check.txt
          grep -q "PASS  README.md" /tmp/repoforge-check.txt
          grep -q "0 warnings, 0 failed" /tmp/repoforge-check.txt

          printf '\n## Maintainer Notes\n\nUser-owned body text.\n' >> /tmp/repoforge-init/README.md
          repoforge check /tmp/repoforge-init > /tmp/repoforge-body-check.txt
          grep -q "PASS  README.md" /tmp/repoforge-body-check.txt

          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/repoforge-init/README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("# SmokeProject", "# HandEditedManagedTitle", 1)
          path.write_text(text, encoding="utf-8")
          PY

          if repoforge check /tmp/repoforge-init > /tmp/repoforge-drift-check.txt; then
            echo "repoforge check unexpectedly accepted drift inside a managed section"
            exit 1
          fi
          grep -q "FAIL  README.md" /tmp/repoforge-drift-check.txt
