project_name: ExampleProject
repository_url: https://github.com/example/example-project

issue_forms:
  bug_title_prefix: "[Bug]: "
  feature_title_prefix: "[Feature]: "
  require_code_of_conduct: true
  blank_issues_enabled: false
  support_link_enabled: true
  security_link_enabled: true

pull_request:
  require_tests: true
  require_docs: true
  require_changelog: false
  contributing_link_enabled: true
  code_of_conduct_link_enabled: true
