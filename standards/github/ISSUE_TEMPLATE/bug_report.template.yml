name: Bug report
description: Report a reproducible problem in {{ project_name }}.
title: "{{ bug_title_prefix }}"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide the smallest reproducible case you can.
        Do not include secrets, private data, or undisclosed security vulnerabilities in this public form.

  - type: checkboxes
    id: existing
    attributes:
      label: Existing issue check
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: What happened?
      description: Describe the current behavior and the impact of the problem.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest configuration, code, data, or command sequence that reproduces the problem.
      placeholder: |
        1. Install / configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, version, or commit are you using?
      placeholder: e.g. 1.2.3 or abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, browser, framework, hardware, or deployment details.
      placeholder: |
        - OS:
        - Runtime / browser:
        - Relevant dependencies:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste only the relevant output. Remove secrets and private information first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, links, or other information only when it helps reproduce or understand the issue.
    validations:
      required: false

{% if require_code_of_conduct %}  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the project's Code of Conduct.
      options:
        - label: I agree to follow the Code of Conduct.
          required: true
{% endif %}